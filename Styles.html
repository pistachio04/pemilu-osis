<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1e40af;
    --primary-2: #3b82f6;
    --primary-dark: #1e3a8a;
    --accent: #f59e0b;
    --success: #16a34a;
    --danger: #dc2626;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(15, 23, 42, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .text-center { text-align: center; }

  /* Top bar */
  .topbar { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; box-shadow: var(--shadow); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 24px; }
  .brand h1 { font-size: 17px; font-weight: 600; line-height: 1.25; }
  .brand p { font-size: 12px; opacity: .85; }
  .topbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .container { max-width: 1140px; margin: 0 auto; padding: 28px 20px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }

  /* Auth */
  .auth-wrap { min-height: calc(100vh - 140px); display: grid; place-items: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 400px; padding: 32px; }
  .auth-icon { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; display: grid; place-items: center; font-size: 32px;
    background: linear-gradient(135deg, #dbeafe, #eff6ff); }
  .auth-card h2 { text-align: center; font-size: 20px; margin-bottom: 4px; }
  .auth-card .sub { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 24px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--muted); }
  .input-wrap { position: relative; }
  .input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font: inherit; font-size: 15px;
    transition: .2s; background: #fff; color: var(--text); }
  .input:focus { outline: none; border-color: var(--primary-2); box-shadow: 0 0 0 4px rgba(59,130,246,.15); }
  .input-wrap .input { padding-right: 64px; }
  .toggle-pass { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: none; cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 500; color: var(--primary); padding: 6px 8px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 12px; border: 0;
    font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; transition: .2s; text-decoration: none; white-space: nowrap; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover:not(:disabled) { filter: brightness(.95); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-light { background: rgba(255,255,255,.18); color: #fff; }
  .btn-light:hover { background: rgba(255,255,255,.28); }
  .btn-outline { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
  .btn-outline:hover { background: #f8fafc; }
  .btn-block { width: 100%; }
  .btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }

  .alert { padding: 12px 14px; border-radius: 12px; font-size: 14px; margin-bottom: 16px; }
  .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

  .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  .spinner.dark { border-color: rgba(30,64,175,.2); border-top-color: var(--primary); width: 36px; height: 36px; border-width: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .badge-open { background: #dcfce7; color: #166534; }
  .badge-closed { background: #fee2e2; color: #991b1b; }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: grid; place-items: center; padding: 20px; z-index: 50; animation: fade .2s; }
  .modal { background: #fff; border-radius: var(--radius); max-width: 420px; width: 100%; padding: 28px; text-align: center; animation: pop .25s; }
  .modal h3 { font-size: 18px; margin-bottom: 8px; }
  .modal p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions .btn { flex: 1; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }

  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 20px; }

  @media (max-width: 600px) {
    .topbar { padding: 14px 16px; }
    .container { padding: 20px 14px; }
    .auth-card { padding: 24px; }
  }
</style>
